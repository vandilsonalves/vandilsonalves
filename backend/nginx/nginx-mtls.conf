# =============================================================
# Nginx mTLS - Efí Bank PIX Webhook
# Ranking Run Pro - Configuração de Produção
# =============================================================
#
# Este servidor Nginx atua como proxy reverso com mTLS habilitado
# para receber webhooks PIX do Efí Bank com segurança.
#
# O Efí Bank envia requisicoes com certificado cliente que deve
# ser validado contra o CA deles (efi-ca-prod.crt).
#
# SETUP:
# 1. Coloque seus certificados SSL do dominio em /certs/
#    - fullchain.pem (certificado do servidor)
#    - privkey.pem (chave privada do servidor)
# 2. O efi-ca-prod.crt ja esta incluido neste diretorio
# 3. Ajuste as variaveis no .env
# 4. Execute: docker-compose up -d
# =============================================================

events {
    worker_connections 1024;
}

http {
    # Logs
    log_format mtls '$remote_addr - $ssl_client_verify [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$ssl_client_s_dn" "$ssl_client_fingerprint"';

    access_log /var/log/nginx/webhook_access.log mtls;
    error_log /var/log/nginx/webhook_error.log;

    # Upstream: sua aplicacao backend (FastAPI)
    upstream backend_app {
        server 127.0.0.1:8001;
    }

    # =========================================================
    # Servidor mTLS para webhook Efi Bank
    # =========================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name rankingrun.com.br;

        # ----- Certificados do SERVIDOR (Let's Encrypt / seu provedor) -----
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # ----- mTLS: Certificado CA do Efi Bank -----
        # Valida o certificado CLIENTE enviado pelo Efi Bank
        # Producao: efi-ca-prod.crt | Homologacao: efi-ca-homolog.crt
        ssl_client_certificate /etc/nginx/certs/efi-ca-prod.crt;
        ssl_verify_client optional;   # 'optional' permite rotas sem mTLS
        ssl_verify_depth 3;

        # ----- Seguranca TLS -----
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ----- Webhook PIX (com mTLS obrigatorio) -----
        # O Efi adiciona /pix automaticamente: /api/efi/webhook/pix
        location ~* ^/api/efi/webhook(/pix)?$ {
            # Exigir certificado cliente valido
            if ($ssl_client_verify != SUCCESS) {
                return 403;
            }

            proxy_pass http://backend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
            proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ----- Demais rotas da API (sem mTLS) -----
        location /api/ {
            proxy_pass http://backend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----- Frontend (React) -----
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Redirect HTTP -> HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name rankingrun.com.br;
        return 301 https://$host$request_uri;
    }
}
